[Log]
Level = "info"   # Log level: debug, info, warn, error
RootDir = "./logs" # Directory for log files. Set to "" to write to stderr only (e.g. for journald).

[Service]
HTTPListenAddr = "localhost:8555" # The address to listen on for HTTP requests.
GRPCListenAddr = "" # BEP-675 BidBlockService endpoint (e.g. "localhost:50051"). Empty = disabled.
RPCConcurrency = 100 # The maximum number of concurrent requests.
RPCTimeout = "10s" # Total RPC timeout. gRPC uses 10s when omitted.

[[Validators]]
PrivateURL = "http://10.200.31.36:8545"
GRPCURL = "10.200.31.36:8552" # host:port, no http://
PublicHostName = "bsc-testnet-elbrus.bnbchain.org"
PayAccountMode = "privateKey"
PrivateKey = "b1fed931ad50...34796ddbee68a53cf"

[[Validators]]
PrivateURL = "http://10.200.33.92:8545"
PublicHostName = "bsc-testnet-ararat.bnbchain.org"
PayAccountMode = "privateKey"
PrivateKey = "ce3f1b757384...755f66f647503"

# Static builder allowlist. Ignored when [Registry] is enabled.
[[Builders]]
Address = "0x980A75eCd1309eA12fa2ED87A8744fBfc9b863D5" # The address of the builder.
URL = "http://bsc-builder-1" # The public URL of the builder.

[[Builders]]
Address = "0x980A75eCd1309eA12fa2ED87A8744fBfc9b863D5"
URL = "http://bsc-builder-2"

# Optional: keep the allowlist in sync with the on-chain BuilderKeyRegistry.
# Effective allowlist = registry set ∪ ExtraBuilders. Service ports open after the first
# successful read. A failed read never changes the allowlist. An empty registry switches to
# allow-all mode (any builder address accepted, logged at error level) until it is refilled.
[Registry]
Enabled = false
ContractAddress = "0x0000000000000000000000000000000000000000" # BuilderKeyRegistry proxy on this network.
# Each poll tries Validators.PrivateURL in order, starting with the first validator.
# Optionally try another trusted node first, then fall back to the validators:
# RPCURL = "http://10.200.31.36:8545"
# All sources must be on the same chain. Each source attempt has a 10-second timeout.
PollInterval = "10m" # While non-empty. Empty registry: 15s. Failed reads: 2s backoff up to 1m.

# Always accepted in addition to the registry set (e.g. a validator's own builder).
# [[Registry.ExtraBuilders]]
# Address = "0x..."
# URL = "http://my-builder"

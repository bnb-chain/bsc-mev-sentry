syntax = "proto3";

package mev.v1;

option go_package = "github.com/bnb-chain/bsc-mev-sentry/proto;mevpb";

// BidBlockService accepts BEP-675 BidBlock submissions over gRPC.
// Other MEV APIs remain on JSON-RPC.
service BidBlockService {
  rpc SendBidBlock(BidBlockRequest) returns (BidBlockResponse);
}

message BidBlockRequest {
  // RLP encoding of the BSC BidBlock (header, transactions, sidecars).
  // Blobs travel as raw bytes — no hex inflation, no JSON parse cost.
  bytes bid_block_rlp = 1;

  // Builder ECDSA signature over BidBlock.Hash() (= header hash).
  bytes signature = 2;

  // Routing hint consumed by the sentry; not forwarded to the validator.
  // Required on the gRPC path: unlike HTTP there is no Host header fallback.
  string validator_host_name = 3;

  reserved 4 to 10;
}

message BidBlockResponse {
  bytes bid_hash = 1;
}
